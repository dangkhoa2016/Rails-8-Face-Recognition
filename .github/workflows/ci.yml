name: Rails CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails8_face_recognition_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rails8_face_recognition_test
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Prepare schema
        run: bin/rails db:prepare
      - name: Ruby tests
        run: bin/rails test
      - name: Browser system tests
        run: bin/rails test:system
      - name: Bilingual documentation integrity
        run: ruby scripts/check_bilingual_docs.rb
      - name: Security scan
        run: bundle exec brakeman --no-pager
      - name: RuboCop
        run: bundle exec rubocop
      - name: Build CSS
        run: bin/rails tailwindcss:build
