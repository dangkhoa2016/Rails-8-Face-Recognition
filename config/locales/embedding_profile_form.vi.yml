vi:
  embedding_profile_form:
    document_title: "Hồ sơ embedding mới"
    back: "Quay lại danh sách hồ sơ embedding"
    eyebrow: "Quản trị / Cấu hình embedding"
    title: "Tạo hoặc tái sử dụng hồ sơ embedding"
    introduction: "Hồ sơ embedding cố định chính xác mô hình và cấu hình dùng để chuyển ảnh khuôn mặt thành vector. Mỗi hồ sơ lưu vector riêng, giúp bạn so sánh số chiều hoặc mô hình mà không xóa kết quả trước đó."
    guide_title: "Hướng dẫn cấu hình hồ sơ embedding"
    guide_intro: "Thực hiện các bước sau trước khi chạy GPU inference. Việc tạo hoặc tái sử dụng hồ sơ chỉ lưu cấu hình."
    step_1_title: "Cấu hình mô hình và dịch vụ"
    step_1_body: "Đăng ký dịch vụ inference và mô hình embedding đã bật trước tiên. Kiểm tra mã API của mô hình và các số chiều được khai báo hỗ trợ."
    step_2_title: "Cố định đúng cấu hình"
    step_2_body: "Chọn mô hình và số chiều phù hợp. Sao chép chính xác phiên bản checkpoint và phiên bản tiền xử lý của mô hình đang triển khai."
    step_3_title: "Lưu rồi chạy preflight"
    step_3_body: "Lưu hồ sơ ở trạng thái Bản nháp. Trên trang chi tiết, preflight gửi một ảnh Core SOURCE được phép tới endpoint để kiểm tra metadata cấu hình và lấy một embedding. Thao tác này sử dụng GPU inference."
    step_4_title: "Chuẩn bị vector và đánh giá chất lượng"
    step_4_body: "Chỉ tạo những vector Core SOURCE còn thiếu, đánh giá chất lượng nhận diện độc lập, đăng ký Recognition Policy đã phê duyệt rồi kích hoạt hồ sơ khi đầy đủ."
    form_title: "Cấu hình chính xác của hồ sơ"
    form_intro: "Nhập giá trị thuộc đúng deployment đã chọn. Không sao chép checkpoint, phiên bản tiền xử lý hoặc chỉ dẫn từ mô hình khác."
    no_models_title: "Chưa có mô hình embedding nào được bật"
    no_models_body: "Hãy thêm dịch vụ inference và bật mô hình embedding trước khi tạo hồ sơ. Không thể lưu khi chưa có mô hình."
    add_model: "Cấu hình mô hình embedding"
    manage_services: "Quản lý dịch vụ inference"
    model_label: "Mô hình embedding đã bật"
    model_prompt: "Chọn mô hình"
    model_hint: "Chọn mô hình API đã cấu hình. Số chiều hỗ trợ được khai báo trong phần cài đặt mô hình; preflight sẽ kiểm tra endpoint thực tế sau đó."
    dimension_label: "Số chiều embedding"
    dimension_placeholder: "Nhập số chiều mà mô hình này hỗ trợ"
    dimension_hint: "Số nguyên được mô hình đã chọn hỗ trợ (tối đa 4096). Vector 1024D không thể dùng thay cho 4096D; mỗi số chiều cần hồ sơ và embedding riêng."
    revision_label: "Phiên bản checkpoint cố định (SHA)"
    revision_placeholder: "40–64 ký tự thập lục phân viết thường"
    revision_hint: "Nhập đúng mã commit/phiên bản checkpoint của mô hình đang triển khai, gồm 40–64 ký tự hex viết thường. Đây không phải commit Git của Rails hay checksum báo cáo."
    preprocessing_label: "Phiên bản tiền xử lý"
    preprocessing_placeholder: "Phiên bản chính xác do deployment công bố"
    preprocessing_hint: "Sao chép chính xác embedding_metadata.preprocessing_version từ mô hình đang triển khai. Các mô hình hoặc phiên bản adapter có thể khác nhau; không mặc định dùng giá trị của Qwen."
    instruction_label: "Chỉ dẫn tùy chỉnh (chỉ Qwen; không bắt buộc)"
    instruction_hint: "Để trống để sử dụng chỉ dẫn mặc định. Chỉ mô hình hỗ trợ mới nhận chỉ dẫn; WeMM từ chối chỉ dẫn tùy chỉnh. Thay đổi chỉ dẫn sẽ tạo hồ sơ khác."
    warning: "Lưu sẽ tạo hồ sơ ở trạng thái Bản nháp hoặc tái sử dụng hồ sơ giống hệt; không tự chạy preflight, tạo vector hay kích hoạt nhận diện. Khi hồ sơ đã được sử dụng, không thể sửa cấu hình ngay trên hồ sơ đó. Embedding cũ không bị cắt ngắn hoặc xóa khi chuyển hồ sơ."
    save: "Lưu hoặc tái sử dụng hồ sơ"
    cancel: "Hủy"
    concept_title: "Vì sao cần các hồ sơ riêng biệt?"
    concept_intro: "Ứng dụng gắn mỗi vector với đúng hồ sơ, gồm mô hình, phiên bản, số chiều và tiền xử lý."
    concept_1_title: "Thay đổi số chiều"
    concept_1_body: "Số chiều mới sử dụng hồ sơ riêng. Các vector trước đây vẫn được giữ nguyên."
    concept_2_title: "Quay lại cấu hình cũ"
    concept_2_body: "Khi chọn lại cấu hình giống hệt, Rails tái sử dụng hồ sơ và các embedding hiện có, không tự tính lại."
    concept_3_title: "So sánh các mô hình"
    concept_3_body: "Qwen và WeMM dùng hồ sơ và vector riêng, ngay cả khi có cùng số chiều."
    next_title: "Sau khi lưu cần làm gì?"
    next_1: "Mở trang chi tiết hồ sơ và chạy preflight (một yêu cầu inference)."
    next_2: "Chỉ tạo các embedding tham chiếu Core SOURCE còn thiếu."
    next_3: "Đánh giá ảnh thử Known và Unknown bằng benchmark độc lập."
    next_4: "Đăng ký và phê duyệt chính sách nhận diện riêng cho hồ sơ trước khi kích hoạt."
    next_note: "Preflight và việc tạo embedding có thể khởi động GPU từ xa và phát sinh chi phí. Chỉ lưu biểu mẫu này thì không."
