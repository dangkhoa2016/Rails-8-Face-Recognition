en:
  recognition_policy_form:
    document_title: "New recognition policy"
    eyebrow: "Administration / Recognition calibration"
    title: "Register a recognition policy"
    introduction: "A policy decides when a query matches an enrolled Core identity, when it is Unknown, and when the evidence is inconclusive. Each policy belongs to one exact embedding profile."
    back: "Back to recognition policies"
    guide_title: "How to set up a recognition policy"
    guide_intro: "Complete the steps in order. Rails stores the reviewed decision rules; it does not calculate a recommended threshold."
    step_1_title: "Select the exact embedding profile"
    step_1_body: "Use the same model, checkpoint revision, dimensions and preprocessing as the evaluation. Do not reuse thresholds across profiles."
    step_2_title: "Evaluate the model independently"
    step_2_body: "Use a separate benchmark notebook with held-out Core probes and Additional unknown probes. Review false matches, rejected known identities and unknown rejection before selecting a threshold."
    step_3_title: "Record the evidence"
    step_3_body: "Enter the evaluated cosine threshold, optional decision margin, immutable evaluation manifest reference and the report file's SHA-256."
    step_4_title: "Save, review and approve"
    step_4_body: "Save a draft, then review and approve it on the policy details page. Activation is a separate action on the embedding profile, once all reference vectors are ready."
    form_title: "Policy parameters"
    form_intro: "Values must come from the evaluation report for the selected profile, not from an example or an estimate."
    no_profiles_title: "No embedding profile is available yet"
    no_profiles_body: "Create an embedding profile before registering its recognition policy. This form cannot be submitted without a profile."
    create_profile: "Create an embedding profile"
    profile_label: "Exact embedding profile"
    profile_prompt: "Choose a profile"
    profile_hint: "A profile pins the embedding model, revision, dimension, preprocessing and instruction. Its policy will not apply to other configurations."
    threshold_label: "Cosine similarity threshold"
    threshold_placeholder: "Value from the independent evaluation"
    threshold_hint: "A number between -1 and 1. A query with a top score below this value is Unknown. You may leave it blank in a draft; approval requires it."
    margin_label: "Top-1 vs top-2 decision margin (optional)"
    margin_hint: "A number between 0 and 2. If the best two scores differ by less than this margin, the result is Indeterminate. Leave blank if the evaluation did not justify a margin."
    manifest_label: "Evaluation manifest reference"
    manifest_placeholder: "Versioned evaluation report or manifest identifier"
    manifest_hint: "A stable reference to the exact evaluated dataset split and configuration. Rails stores the reference; it does not fetch this document."
    sha_label: "Evaluation report SHA-256"
    sha_placeholder: "64 lowercase hexadecimal characters"
    sha_hint: "SHA-256 of the evaluation report file, not the model checkpoint. Use the full 64-character lowercase digest so reviewers can verify the report."
    draft_warning: "Saving creates a Not calibrated draft. You can omit evidence until review, but approval requires a threshold, manifest reference, report SHA-256 and a reviewer. Saving or approving does not activate recognition."
    save_draft: "Save policy draft"
    cancel: "Cancel"
    decision_title: "How a recognition decision is made"
    decision_intro: "Rails compares the query embedding with enrolled Core SOURCE embeddings from the same profile."
    unknown_title: "Unknown"
    unknown_body: "The highest cosine score is below the approved threshold."
    indeterminate_title: "Indeterminate"
    indeterminate_body: "If a margin is configured, the top two scores are too close. An empty reference gallery also produces an inconclusive result."
    matched_title: "Matched"
    matched_body: "The highest score meets the threshold and, when configured, the margin requirement also passes."
    decision_note: "Cosine similarity is not an identity probability or an accuracy percentage. Results on synthetic faces do not establish real-world biometric performance."
    checklist_title: "Before approving a policy"
    checklist_1: "The benchmark used the exact embedding profile and held-out probes."
    checklist_2: "The threshold and optional margin have supporting evaluation results."
    checklist_3: "The manifest reference and report SHA-256 identify the reviewed evidence."
    checklist_4: "The selected profile has all required Core SOURCE vectors before activation."
