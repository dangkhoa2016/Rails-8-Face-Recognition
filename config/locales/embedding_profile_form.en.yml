en:
  embedding_profile_form:
    document_title: "New embedding profile"
    back: "Back to embedding profiles"
    eyebrow: "Administration / Embedding configuration"
    title: "Create or reuse an embedding profile"
    introduction: "An embedding profile pins the exact model and settings used to convert face images into vectors. Different profiles keep independent vectors, so you can compare dimensions or models without deleting earlier results."
    guide_title: "How to configure an embedding profile"
    guide_intro: "Follow these steps before running any GPU inference. Creating or reusing a profile only stores its configuration."
    step_1_title: "Configure a model and its service"
    step_1_body: "Register the inference service and enabled embedding model first. Check the model's declared API ID and supported dimensions."
    step_2_title: "Pin the exact configuration"
    step_2_body: "Choose the model and a supported dimension. Copy the checkpoint revision and preprocessing version from the specific deployed model."
    step_3_title: "Save, then run preflight"
    step_3_body: "Save a Draft profile. On its details page, preflight sends one authorized Core SOURCE image to the configured endpoint to verify configuration metadata and obtain an embedding. This uses GPU inference."
    step_4_title: "Prepare references and validate quality"
    step_4_body: "Generate only missing Core SOURCE vectors, evaluate matching quality independently, register an approved Recognition Policy, and then activate the complete profile."
    form_title: "Exact profile configuration"
    form_intro: "Use values that belong to your selected deployment. Do not copy a checkpoint, preprocessing version or instruction from a different model."
    no_models_title: "No enabled embedding models available"
    no_models_body: "Add an inference service and an enabled embedding model before creating a profile. Saving is disabled until a model is available."
    add_model: "Configure an embedding model"
    manage_services: "Manage inference services"
    model_label: "Enabled embedding model"
    model_prompt: "Choose a model"
    model_hint: "Choose the configured API model. Supported dimensions are declared in the model settings; preflight later checks the deployed endpoint."
    dimension_label: "Embedding dimensions"
    dimension_placeholder: "Enter a dimension supported by this model"
    dimension_hint: "An integer supported by the selected model (maximum 4096). A 1024D vector is not interchangeable with a 4096D vector; different dimensions need separate profiles and embeddings."
    revision_label: "Pinned checkpoint revision (SHA)"
    revision_placeholder: "40–64 lowercase hexadecimal characters"
    revision_hint: "Enter the exact checkpoint commit/revision of the deployed model, using 40–64 lowercase hex characters. This is not the Rails Git commit or a report checksum."
    preprocessing_label: "Preprocessing version"
    preprocessing_placeholder: "Exact version advertised by the deployment"
    preprocessing_hint: "Copy the exact embedding_metadata.preprocessing_version from the deployed model. Different models or adapter versions may use different values; no Qwen-specific default is assumed."
    instruction_label: "Custom instruction (Qwen only; optional)"
    instruction_hint: "Leave blank for the model's default. Only models that explicitly support an instruction can accept one; WeMM rejects custom instructions. Changing the instruction creates a different profile."
    warning: "Saving creates a Draft profile or reuses the identical existing profile; it does not run preflight, generate vectors, or activate recognition. Once used, the configuration cannot be changed in place. Previously stored embeddings are never truncated or discarded when switching profiles."
    save: "Save or reuse profile"
    cancel: "Cancel"
    concept_title: "Why use separate profiles?"
    concept_intro: "The application links each vector to its exact profile, including the model, revision, dimensions and preprocessing."
    concept_1_title: "Changing dimensions"
    concept_1_body: "A new dimension uses a separate profile. Earlier vectors are kept intact."
    concept_2_title: "Reusing an earlier setting"
    concept_2_body: "Selecting the identical configuration again reuses the existing profile and available embeddings, rather than recomputing them automatically."
    concept_3_title: "Comparing models"
    concept_3_body: "Qwen and WeMM have separate profiles and embeddings, even at the same vector dimension."
    next_title: "What happens after saving?"
    next_1: "Open the profile details page and run preflight (one inference request)."
    next_2: "Generate only the missing Core SOURCE reference embeddings."
    next_3: "Evaluate known and unknown probes in an independent benchmark."
    next_4: "Register and approve a profile-specific recognition policy before activation."
    next_note: "Preflight and embedding generation may start a remote GPU and incur costs. Saving this form alone does not."
