vi:
  recognition_policy_form:
    document_title: "Chính sách nhận diện mới"
    eyebrow: "Quản trị / Hiệu chuẩn nhận diện"
    title: "Đăng ký chính sách nhận diện"
    introduction: "Chính sách quy định khi nào ảnh truy vấn khớp với một định danh Core đã đăng ký, khi nào trả về Unknown và khi nào bằng chứng chưa đủ để kết luận. Mỗi chính sách chỉ gắn với một hồ sơ embedding cụ thể."
    back: "Quay lại danh sách chính sách"
    guide_title: "Hướng dẫn thiết lập chính sách nhận diện"
    guide_intro: "Thực hiện theo thứ tự dưới đây. Rails chỉ lưu quy tắc đã được đánh giá; hệ thống không tự tính hoặc đề xuất ngưỡng."
    step_1_title: "Chọn đúng hồ sơ embedding"
    step_1_body: "Sử dụng đúng mô hình, phiên bản checkpoint, số chiều và cách tiền xử lý đã dùng khi đánh giá. Không dùng chung ngưỡng giữa các hồ sơ."
    step_2_title: "Đánh giá mô hình độc lập"
    step_2_body: "Dùng notebook benchmark riêng với ảnh thử Core không dùng để enrollment và ảnh thử Unknown từ Additional. Kiểm tra khớp sai, từ chối nhầm người đã biết và khả năng từ chối Unknown trước khi chọn ngưỡng."
    step_3_title: "Ghi nhận bằng chứng"
    step_3_body: "Nhập ngưỡng cosine từ kết quả đánh giá, biên chênh lệch (nếu có), tham chiếu manifest đánh giá bất biến và SHA-256 của tệp báo cáo."
    step_4_title: "Lưu nháp, kiểm tra và phê duyệt"
    step_4_body: "Lưu bản nháp, sau đó kiểm tra và phê duyệt ở trang chi tiết chính sách. Việc kích hoạt là thao tác riêng tại hồ sơ embedding, khi toàn bộ vector tham chiếu đã sẵn sàng."
    form_title: "Thông số chính sách"
    form_intro: "Chỉ nhập các giá trị đã được đo trong báo cáo đánh giá của hồ sơ được chọn; không sử dụng số ví dụ hoặc tự ước lượng."
    no_profiles_title: "Chưa có hồ sơ embedding"
    no_profiles_body: "Hãy tạo hồ sơ embedding trước khi đăng ký chính sách nhận diện. Không thể gửi biểu mẫu nếu chưa chọn được hồ sơ."
    create_profile: "Tạo hồ sơ embedding"
    profile_label: "Hồ sơ embedding chính xác"
    profile_prompt: "Chọn hồ sơ embedding"
    profile_hint: "Hồ sơ cố định mô hình, phiên bản, số chiều, tiền xử lý và chỉ dẫn. Chính sách không áp dụng cho cấu hình khác."
    threshold_label: "Ngưỡng tương đồng cosine"
    threshold_placeholder: "Giá trị từ kết quả đánh giá độc lập"
    threshold_hint: "Giá trị từ -1 đến 1. Nếu điểm cao nhất thấp hơn ngưỡng này, kết quả là Unknown. Có thể để trống trong bản nháp; bắt buộc phải có trước khi phê duyệt."
    margin_label: "Biên chênh lệch top-1 và top-2 (không bắt buộc)"
    margin_hint: "Giá trị từ 0 đến 2. Nếu điểm của hai ứng viên tốt nhất chênh lệch ít hơn biên này, kết quả là Chưa đủ bằng chứng. Để trống nếu đánh giá không chứng minh cần dùng biên."
    manifest_label: "Tham chiếu manifest đánh giá"
    manifest_placeholder: "Mã báo cáo hoặc manifest đánh giá có phiên bản"
    manifest_hint: "Tham chiếu ổn định đến bộ dữ liệu thử nghiệm và cấu hình đã đánh giá. Rails chỉ lưu tham chiếu, không tải tài liệu từ đây."
    sha_label: "SHA-256 của báo cáo đánh giá"
    sha_placeholder: "64 ký tự hệ thập lục phân viết thường"
    sha_hint: "SHA-256 của tệp báo cáo đánh giá, không phải checkpoint của mô hình. Dùng đủ 64 ký tự viết thường để người phê duyệt có thể kiểm chứng báo cáo."
    draft_warning: "Nút Lưu bản nháp tạo chính sách ở trạng thái Chưa hiệu chuẩn. Có thể bổ sung bằng chứng sau, nhưng để phê duyệt cần có ngưỡng, tham chiếu manifest, SHA-256 báo cáo và người duyệt. Lưu hoặc phê duyệt chính sách không tự kích hoạt nhận diện."
    save_draft: "Lưu bản nháp chính sách"
    cancel: "Hủy"
    decision_title: "Hệ thống đưa ra kết luận như thế nào?"
    decision_intro: "Rails so sánh embedding của ảnh truy vấn với các embedding Core SOURCE đã enrollment thuộc cùng hồ sơ."
    unknown_title: "Unknown — Không xác định"
    unknown_body: "Điểm tương đồng cosine cao nhất thấp hơn ngưỡng đã phê duyệt."
    indeterminate_title: "Chưa đủ bằng chứng"
    indeterminate_body: "Nếu có cấu hình biên chênh lệch, điểm của hai ứng viên cao nhất quá gần nhau. Thư viện tham chiếu rỗng cũng cho kết quả chưa thể kết luận."
    matched_title: "Matched — Khớp"
    matched_body: "Điểm cao nhất đạt ngưỡng và, nếu có cấu hình biên chênh lệch, điều kiện về biên cũng được thỏa mãn."
    decision_note: "Độ tương đồng cosine không phải xác suất nhận diện đúng hoặc tỷ lệ phần trăm chính xác. Đánh giá trên ảnh tổng hợp không chứng minh hiệu năng sinh trắc học ngoài đời thực."
    checklist_title: "Kiểm tra trước khi phê duyệt"
    checklist_1: "Benchmark sử dụng đúng hồ sơ embedding và tập ảnh thử tách khỏi enrollment."
    checklist_2: "Ngưỡng và biên chênh lệch (nếu có) được chứng minh bằng kết quả đánh giá."
    checklist_3: "Tham chiếu manifest và SHA-256 xác định đúng bằng chứng đã kiểm tra."
    checklist_4: "Hồ sơ đã có đủ vector Core SOURCE cần thiết trước khi kích hoạt."
